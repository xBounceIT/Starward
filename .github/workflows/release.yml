name: Release & Publish Docker Images

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag & derive version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      repo_lower: ${{ steps.version.outputs.repo_lower }}
    steps:
      - name: Validate SemVer tag and compute metadata
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected SemVer format vX.Y.Z (or vX.Y.Z-prerelease)."
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          REPO_LOWER="${REPO,,}"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "repo_lower=${REPO_LOWER}"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG}"
          echo "Derived app version: ${VERSION}"
          echo "Prerelease: ${IS_PRERELEASE}"
          echo "GHCR repository prefix: ghcr.io/${REPO_LOWER}"

  build-and-push:
    name: Build & Push (${{ matrix.name }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            title: Starward Backend
            description: Starward Password Manager - Rust Axum encrypted vault backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            title: Starward Frontend
            description: Starward Password Manager - TanStack Start frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.repo_lower }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Create GitHub Release
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate release notes and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
          REPO_LOWER: ${{ needs.prepare.outputs.repo_lower }}
        run: |
          set -euo pipefail

          GENERATED_NOTES="$(gh api \
            --method POST \
            "repos/${REPO}/releases/generate-notes" \
            -f "tag_name=${TAG}" \
            --jq '.body')"

          {
            if [[ -n "$GENERATED_NOTES" ]]; then
              printf '%s\n\n' "$GENERATED_NOTES"
            fi
            cat <<EOF
          ### Docker Images (GHCR)

          - **Backend**: \`ghcr.io/${REPO_LOWER}-backend:${TAG}\` (\`${VERSION}\`)
          - **Frontend**: \`ghcr.io/${REPO_LOWER}-frontend:${TAG}\` (\`${VERSION}\`)

          #### Deploy with Docker Compose

          \`\`\`bash
          STARWARD_VERSION=${TAG} docker compose -f docker-compose.prod.yml pull
          STARWARD_VERSION=${TAG} docker compose -f docker-compose.prod.yml up -d
          \`\`\`
          EOF
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" docker-compose.prod.yml --clobber
          else
            EXTRA_ARGS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              EXTRA_ARGS+=(--prerelease)
            else
              EXTRA_ARGS+=(--latest)
            fi

            gh release create "$TAG" docker-compose.prod.yml \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
