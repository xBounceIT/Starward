services:
  postgres:
    image: postgres:19-alpine
    container_name: starward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production (no default)}
      POSTGRES_DB: ${POSTGRES_DB:-starward}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - starward_pgdata:/var/lib/postgresql
    networks:
      - starward-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starward} -d ${POSTGRES_DB:-starward}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${STARWARD_BACKEND_IMAGE:-ghcr.io/xbounceit/starward-backend}:${STARWARD_VERSION:-latest}
    container_name: starward-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-starward}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starward}
      STARWARD_AUTH_SECRET: ${STARWARD_AUTH_SECRET:?STARWARD_AUTH_SECRET is required in production (min 32 random chars, no default)}
      STARWARD_MASTER_KEY: ${STARWARD_MASTER_KEY:?STARWARD_MASTER_KEY is required in production (min 32 random chars, no default)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production (set it to the public frontend URL, e.g. https://vault.example.com)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RUST_LOG: ${RUST_LOG:-starward_backend=info,tower_http=info}
      # Only when the backend is reachable exclusively through a reverse proxy
      # that overwrites X-Forwarded-For (enables Service Account IP allowlists
      # based on the real client IP instead of the proxy IP):
      STARWARD_TRUST_PROXY_HEADERS: ${STARWARD_TRUST_PROXY_HEADERS:-false}
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"
    networks:
      - starward-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  frontend:
    image: ${STARWARD_FRONTEND_IMAGE:-ghcr.io/xbounceit/starward-frontend}:${STARWARD_VERSION:-latest}
    container_name: starward-frontend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required in production (public URL, e.g. https://vault.example.com)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required in production (min 32 random chars, no default)}
      DATABASE_URL: postgres://${POSTGRES_USER:-starward}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starward}
      RUST_BACKEND_URL: http://backend:8080
      STARWARD_AUTH_SECRET: ${STARWARD_AUTH_SECRET:?STARWARD_AUTH_SECRET is required in production (min 32 random chars, no default)}
      SSO_OIDC_NAME: ${SSO_OIDC_NAME:-SSO Aziendale (OIDC)}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_DISCOVERY_URL: ${SSO_OIDC_DISCOVERY_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    networks:
      - starward-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

networks:
  starward-net:
    driver: bridge

volumes:
  starward_pgdata:
